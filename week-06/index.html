<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 급식</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6f4f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘 급식">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f4f1ea;
    color: #222;
    line-height: 1.5;
  }
  main {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 6vw, 2rem); }
  #date { margin: 4px 0 20px; color: #666; }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 1.1rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .kcal { font-size: 0.85rem; font-weight: normal; color: #888; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 1.05rem;
    overflow-wrap: anywhere;
  }
  li:last-child { border-bottom: none; }
  .allergy { margin-left: 6px; font-size: 0.75rem; color: #999; white-space: nowrap; }
  .message { text-align: center; padding: 32px 20px; font-size: 1.1rem; }
  .message.error { color: #b3261e; }
  .message small { display: block; margin-top: 8px; color: #777; font-size: 0.85rem; }
  button {
    margin-top: 14px;
    padding: 8px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #2f6f4f;
    color: #fff;
    cursor: pointer;
  }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 12px;
    border: 4px solid #ddd; border-top-color: #2f6f4f; border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .offline {
    background: #fff4d6;
    border: 1px solid #f2b84b;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.95rem;
  }
  .offline strong { display: block; margin-bottom: 4px; }
  .offline p { margin: 2px 0; color: #555; }
  .offline button { margin-top: 10px; font-size: 0.9rem; padding: 6px 14px; }
</style>
</head>
<body>
<main>
  <h1>오늘 급식</h1>
  <p id="date"></p>
  <div id="content"></div>
</main>

<script>
  // 나이스 급식 식단 정보 API (키 없이 사용)
  const OFFICE_CODE = "J10";      // 교육청 코드
  const SCHOOL_CODE = "7530627";  // 학교 코드

  const content = document.getElementById("content");

  // 한국 시간 기준 오늘 날짜 (주소 끝에 ?date=20261113 처럼 붙이면 그 날짜로 볼 수 있음)
  function getDate() {
    const fromUrl = new URLSearchParams(location.search).get("date");
    if (fromUrl && /^\d{8}$/.test(fromUrl)) return fromUrl;
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit"
    }).format(new Date()); // 2026-11-14
    return parts.replace(/-/g, "");
  }

  function showDate(ymd) {
    const d = new Date(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8));
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    document.getElementById("date").textContent =
      `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  }

  function showMessage(text, detail, isError) {
    content.innerHTML = "";
    const box = document.createElement("div");
    box.className = "card message" + (isError ? " error" : "");
    box.textContent = text;
    if (detail) {
      const small = document.createElement("small");
      small.textContent = detail;
      box.appendChild(small);
    }
    if (isError) {
      const btn = document.createElement("button");
      btn.textContent = "다시 불러오기";
      btn.onclick = load;
      box.appendChild(btn);
    }
    content.appendChild(box);
  }

  function showLoading() {
    content.innerHTML =
      '<div class="card message"><div class="spinner"></div>급식 정보를 불러오는 중이에요…</div>';
  }

  // "곤드레밥+양념장 (5.6.10.13)" → 이름과 알레르기 번호로 나누기
  function parseDish(raw) {
    const m = raw.match(/^(.*?)\s*\(([\d.\s]+)\)\s*$/);
    let name = m ? m[1] : raw;
    const allergy = m ? m[2].split(".").map(s => s.trim()).filter(Boolean) : [];
    name = name.replace(/\*+/g, "").trim();
    return { name, allergy };
  }

  function showMeals(rows) {
    content.innerHTML = "";
    rows.sort((a, b) => a.MMEAL_SC_CODE - b.MMEAL_SC_CODE);
    for (const row of rows) {
      const card = document.createElement("section");
      card.className = "card";

      const h2 = document.createElement("h2");
      h2.textContent = row.MMEAL_SC_NM;
      if (row.CAL_INFO) {
        const kcal = document.createElement("span");
        kcal.className = "kcal";
        kcal.textContent = row.CAL_INFO;
        h2.appendChild(kcal);
      }
      card.appendChild(h2);

      const ul = document.createElement("ul");
      for (const raw of row.DDISH_NM.split(/<br\s*\/?>/i)) {
        if (!raw.trim()) continue;
        const dish = parseDish(raw.trim());
        const li = document.createElement("li");
        li.textContent = dish.name;
        if (dish.allergy.length) {
          const span = document.createElement("span");
          span.className = "allergy";
          span.textContent = dish.allergy.join(" · ");
          span.title = "알레르기 번호";
          li.appendChild(span);
        }
        ul.appendChild(li);
      }
      card.appendChild(ul);
      content.appendChild(card);
    }
  }

  // 마지막으로 받아 온 정보를 이 기기(브라우저)에 저장해 두기
  const SAVE_KEY = "lastMeal";

  function saveLast(ymd, rows) {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ ymd, rows, fetchedAt: Date.now() }));
    } catch (e) { /* 저장이 막힌 브라우저면 그냥 넘어감 */ }
  }

  function readLast() {
    try {
      const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (saved && saved.ymd && Array.isArray(saved.rows) && saved.fetchedAt) return saved;
    } catch (e) { }
    return null;
  }

  function showResult(rows) {
    if (rows.length) showMeals(rows);
    else showMessage("오늘은 급식이 없습니다");
  }

  function shortDate(ymd) {
    return `${+ymd.slice(4, 6)}월 ${+ymd.slice(6, 8)}일`;
  }

  // 받아 오기에 실패했을 때: 저장해 둔 정보가 있으면 그걸, 없으면 까닭만 보여 줌
  function fail(reason, today) {
    const saved = readLast();
    if (!saved) {
      showMessage("급식 정보를 받아 오지 못했어요.", reason, true);
      return;
    }
    showDate(saved.ymd);
    showResult(saved.rows);

    const when = new Date(saved.fetchedAt).toLocaleString("ko-KR", {
      timeZone: "Asia/Seoul", year: "numeric", month: "long", day: "numeric",
      hour: "numeric", minute: "2-digit"
    });
    const box = document.createElement("div");
    box.className = "offline";
    const title = document.createElement("strong");
    title.textContent = "새 정보를 받아 오지 못해서, 마지막으로 받아 온 정보를 보여 줘요.";
    box.appendChild(title);
    const lines = [`받은 때: ${when}`, `까닭: ${reason}`];
    if (saved.ymd !== today) {
      lines.unshift(`아래는 오늘(${shortDate(today)})이 아니라 ${shortDate(saved.ymd)} 급식이에요.`);
    }
    for (const text of lines) {
      const p = document.createElement("p");
      p.textContent = text;
      box.appendChild(p);
    }
    const btn = document.createElement("button");
    btn.textContent = "다시 불러오기";
    btn.onclick = load;
    box.appendChild(btn);
    content.prepend(box);
  }

  async function load() {
    const ymd = getDate();
    showDate(ymd);
    showLoading();

    const url = "https://open.neis.go.kr/hub/mealServiceDietInfo?" + new URLSearchParams({
      Type: "json", pIndex: 1, pSize: 10,
      ATPT_OFCDC_SC_CODE: OFFICE_CODE, SD_SCHUL_CODE: SCHOOL_CODE, MLSV_YMD: ymd
    });

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 10000);

    try {
      const res = await fetch(url, { signal: controller.signal });
      if (!res.ok) {
        fail(`나이스 서버가 응답하지 않아요 (오류 ${res.status}). 잠시 뒤에 다시 해 보세요.`, ymd);
        return;
      }
      const data = await res.json();

      if (data.mealServiceDietInfo) {
        const head = data.mealServiceDietInfo[0].head;
        const rows = data.mealServiceDietInfo[1].row;
        const code = head[1].RESULT.CODE;
        const list = code === "INFO-000" && rows ? rows : [];
        saveLast(ymd, list);
        showResult(list);
        return;
      }

      const code = data.RESULT && data.RESULT.CODE;
      if (code === "INFO-200") {
        saveLast(ymd, []);
        showResult([]);
      } else {
        fail(`나이스가 알려 준 까닭: ${(data.RESULT && data.RESULT.MESSAGE) || "알 수 없음"}`, ymd);
      }
    } catch (err) {
      if (err.name === "AbortError") {
        fail("10초 동안 응답이 없어요. 인터넷 연결을 확인하고 다시 해 보세요.", ymd);
      } else if (!navigator.onLine) {
        fail("인터넷에 연결되어 있지 않아요. 연결한 뒤 다시 해 보세요.", ymd);
      } else {
        fail("나이스 서버에 연결하지 못했어요. 잠시 뒤에 다시 해 보세요.", ymd);
      }
    } finally {
      clearTimeout(timer);
    }
  }

  load();

  // 폰에 설치되는 앱(PWA)을 위한 서비스 워커 등록 (파일을 두 번 눌러 열 때는 건너뜀)
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => { });
  }
</script>
</body>
</html>
