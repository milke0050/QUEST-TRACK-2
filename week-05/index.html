<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스킬 격투 · 개구리 vs VR 소년</title>
<style>
  html, body { margin: 0; height: 100%; background: #14101f; color: #e8e4f4;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  canvas { width: min(96vw, calc((100vh - 160px) * 16 / 9)); aspect-ratio: 16 / 9;
    image-rendering: pixelated; background: #000; border: 2px solid #3a2f5c; border-radius: 6px; }
  #help { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; font-size: 14px; line-height: 1.6; }
  #help b { color: #ffd76a; }
  kbd { background: #2a2244; border: 1px solid #4b3f78; border-radius: 4px; padding: 0 5px; font-family: inherit; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="help">
  <div><b>1P 닌자 개구리</b> · 이동 <kbd>A</kbd><kbd>D</kbd> · 점프 <kbd>W</kbd> (공중에서 한 번 더) · 내려가기 <kbd>S</kbd><br>
    주먹 <kbd>F</kbd> · 총알 <kbd>G</kbd> · 전기 충격 <kbd>H</kbd> (기력 50) · 피하기 <kbd>E</kbd></div>
  <div><b>2P VR 소년</b> · 이동 <kbd>←</kbd><kbd>→</kbd> · 점프 <kbd>↑</kbd> · 내려가기 <kbd>↓</kbd><br>
    주먹 <kbd>,</kbd> · 총알 <kbd>.</kbd> · 전기 충격 <kbd>/</kbd> · 피하기 <kbd>오른쪽 Shift</kbd> (숫자패드 1 2 3 0 도 됨)</div>
  <div><b>혼자 하기</b>일 때는 1P 를 방향키·<kbd>Space</kbd>·<kbd>J</kbd><kbd>K</kbd><kbd>L</kbd>·피하기 <kbd>;</kbd> 로도 움직일 수 있어요.<br>
    피하기: 땅에서 구르는 동안은 아무것도 안 맞아요 · 벽에 붙어서 점프하면 벽 점프! · <kbd>Esc</kbd> 처음 화면</div>
</div>
<script>
'use strict';
// ================= 화면 =================
const W = 480, H = 270, SCALE = 3;          // 게임 좌표 480×270, 실제로는 3배로 그림
const GROUND = 238, LEFT_WALL = 8, RIGHT_WALL = W - 8;
const canvas = document.getElementById('game');
canvas.width = W * SCALE; canvas.height = H * SCALE;
const ctx = canvas.getContext('2d');
const FONT = '"Malgun Gothic", "Apple SD Gothic Neo", sans-serif';

// ================= 에셋 (drop.json 정보) =================
const IMG_DIR = 'assets/images/';
const CHAR_DEFS = {
  frog: { name: '닌자 개구리', file: 'ninja-frog',  fw: 32, fh: 32, color: '#7be07b' },
  guy:  { name: 'VR 소년',     file: 'virtual-guy', fw: 27, fh: 28, color: '#6ec6ff' },
};
// 캐릭터 애니메이션: [프레임 수, fps, 반복]
const CHAR_ANIMS = {
  'idle': [11, 20, true], 'run': [12, 20, true], 'jump': [1, 20, true], 'double-jump': [6, 20, true],
  'fall': [1, 10, true], 'wall-jump': [5, 20, true], 'hit': [7, 20, false],
};
const FX_DEFS = {
  crack: { file: 'hits-crack_explode.png',      fw: 32, fh: 32, frames: 7, fps: 14, loop: false },
  boom:  { file: 'explosion-small_explode.png', fw: 32, fh: 32, frames: 7, fps: 18, loop: false },
  shock: { file: 'electro-shock_explode.png',   fw: 72, fh: 87, frames: 9, fps: 18, loop: false },
  shot:  { file: 'hunter-shot_shoot.png',       fw: 25, fh: 6,  frames: 2, fps: 14, loop: true },
};
const images = {}, missing = [];
function loadImage(name) {
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => { images[name] = im; resolve(); };
    im.onerror = () => { missing.push(name); resolve(); };
    im.src = IMG_DIR + name;
  });
}
function allImageNames() {
  const list = [];
  for (const c of Object.values(CHAR_DEFS)) for (const a of Object.keys(CHAR_ANIMS)) list.push(`${c.file}_${a}.png`);
  for (const f of Object.values(FX_DEFS)) list.push(f.file);
  return list;
}

// ================= 규칙 숫자 =================
const GRAVITY = 900, SPEED = 115, JUMP_V = 300, DJUMP_V = 270, WALL_VX = 190, WALL_VY = 280;
const SKILLS = {
  punch: { cd: 0.35, dmg: 7,  kb: 150, stun: 0.30 },
  shot:  { cd: 0.90, dmg: 6,  kb: 100, stun: 0.25, speed: 260 },
  shock: { cd: 1.20, dmg: 18, kb: 240, stun: 0.65, lift: 210, cost: 50, delay: 0.17 },
  roll:  { cd: 0.80, time: 0.35, speed: 220 },   // 피하기: 구르는 동안 안 맞음
};
const PLATFORMS = [ { x: 60, y: 182, w: 90 }, { x: 330, y: 182, w: 90 }, { x: 195, y: 132, w: 90 } ];
const ROUND_TIME = 60, WINS_NEEDED = 2;

// ================= 키 입력 =================
const down = new Set(), pressed = new Set();
const KEYMAP = {
  p1: { left: ['KeyA'], right: ['KeyD'], jump: ['KeyW'], down: ['KeyS'], s1: ['KeyF'], s2: ['KeyG'], s3: ['KeyH'], dodge: ['KeyE'] },
  p2: { left: ['ArrowLeft'], right: ['ArrowRight'], jump: ['ArrowUp'], down: ['ArrowDown'],
        s1: ['Comma', 'Numpad1'], s2: ['Period', 'Numpad2'], s3: ['Slash', 'Numpad3'], dodge: ['ShiftRight', 'Numpad0'] },
  solo: { left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], jump: ['KeyW', 'ArrowUp', 'Space'],
          down: ['KeyS', 'ArrowDown'], s1: ['KeyF', 'KeyJ'], s2: ['KeyG', 'KeyK'], s3: ['KeyH', 'KeyL'], dodge: ['KeyE', 'Semicolon'] },
};
const GAME_KEYS = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Slash']);
addEventListener('keydown', e => {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  if (!e.repeat) pressed.add(e.code);
  down.add(e.code);
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
const anyDown = codes => codes.some(c => down.has(c));
const anyPressed = codes => codes.some(c => pressed.has(c));
function humanInput(map) {
  return {
    move: (anyDown(map.right) ? 1 : 0) - (anyDown(map.left) ? 1 : 0),
    jump: anyPressed(map.jump), down: anyDown(map.down),
    s1: anyPressed(map.s1), s2: anyPressed(map.s2), s3: anyPressed(map.s3), dodge: anyPressed(map.dodge),
  };
}

// ================= 게임 상태 =================
let state = 'title', mode = 1, stateT = 0, round = 1, wins = [0, 0], timer = ROUND_TIME;
let p1 = null, p2 = null, projectiles = [], effects = [], popups = [];
let shake = 0, hitstop = 0, banner = '', subBanner = '', titleT = 0;

function makeFighter(kind, x, facing, ctrl, tag) {
  return { kind, def: CHAR_DEFS[kind], x, y: GROUND, vx: 0, vy: 0, kb: 0, facing, ctrl, tag,
    onGround: true, jumpsUsed: 0, djT: 9, wall: 0, dropT: 0, castT: 0, rollT: 0, rollDir: 0,
    hp: 100, hpShown: 100, energy: 0, noEnergyT: 0,
    anim: 'idle', animT: 0, stun: 0, invuln: 0, cd: { punch: 0, shot: 0, shock: 0, roll: 0 }, pendingShock: null };
}
function startMatch(m) { mode = m; wins = [0, 0]; round = 1; startRound(); }
function startRound() {
  p1 = makeFighter('frog', 130, 1, mode === 1 ? 'solo' : 'p1', '1P');
  p2 = makeFighter('guy', 350, -1, mode === 1 ? 'cpu' : 'p2', mode === 1 ? 'CPU' : '2P');
  projectiles = []; effects = []; popups = [];
  timer = ROUND_TIME; state = 'ready'; stateT = 0; ai.t = 0; ai.move = 0;
}
function endRound(winner, reason) {
  if (state !== 'fight') return;
  state = 'ko'; stateT = 0;
  if (winner) wins[winner === p1 ? 0 : 1]++;
  banner = reason === 'time' ? '시간 끝!' : 'K.O.!';
  subBanner = winner ? `${winner.def.name} 승리` : '무승부';
}

// ================= 캐릭터 움직임 =================
const boxOf = f => ({ l: f.x - 9, r: f.x + 9, t: f.y - 26, b: f.y });
const overlap = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
function setAnim(f, a) { if (f.anim !== a) { f.anim = a; f.animT = 0; } }

function updateFighter(f, opp, inp, dt) {
  f.animT += dt; f.djT += dt;
  for (const k in f.cd) f.cd[k] = Math.max(0, f.cd[k] - dt);
  f.invuln = Math.max(0, f.invuln - dt);
  f.noEnergyT = Math.max(0, f.noEnergyT - dt);
  f.dropT = Math.max(0, f.dropT - dt);
  f.castT = Math.max(0, f.castT - dt);
  f.rollT = Math.max(0, f.rollT - dt);
  f.hpShown += (f.hp - f.hpShown) * Math.min(1, dt * 4);
  if (f.stun > 0) f.stun -= dt;
  if (state === 'fight') f.energy = Math.min(100, f.energy + 3 * dt);

  const canAct = state === 'fight' && f.stun <= 0 && f.hp > 0;
  // 피하기: 땅에서 누른 방향으로 구름 (방향키를 안 누르면 상대 반대쪽으로)
  if (canAct && f.rollT <= 0 && f.castT <= 0 && inp.dodge && f.cd.roll <= 0 && f.onGround) {
    f.rollDir = inp.move || (opp.x >= f.x ? -1 : 1);
    f.rollT = SKILLS.roll.time; f.cd.roll = SKILLS.roll.cd; f.facing = f.rollDir;
  }
  const rolling = f.rollT > 0;
  const move = canAct && f.castT <= 0 && !rolling ? inp.move : 0;
  if (canAct && !rolling) {
    if (move !== 0) f.facing = move;
    else if (f.onGround) f.facing = opp.x >= f.x ? 1 : -1;
  }

  // 점프 · 2단 점프 · 벽 점프
  if (canAct && !rolling && inp.jump) {
    if (f.onGround && inp.down && f.y < GROUND) { f.dropT = 0.25; f.onGround = false; f.jumpsUsed = 1; }
    else if (f.onGround) { f.vy = -JUMP_V; f.onGround = false; f.jumpsUsed = 1; }
    else if (f.wall !== 0) { f.vy = -WALL_VY; f.kb = -f.wall * WALL_VX; f.facing = -f.wall; f.jumpsUsed = 1; f.wall = 0; }
    else if (f.jumpsUsed < 2) { f.vy = -DJUMP_V; f.jumpsUsed = 2; f.djT = 0; f.animT = 0; }
  }

  // 스킬
  if (canAct && f.castT <= 0 && !rolling) {
    if (inp.s1 && f.cd.punch <= 0) doPunch(f, opp);
    else if (inp.s2 && f.cd.shot <= 0) doShot(f);
    else if (inp.s3 && f.cd.shock <= 0) {
      if (f.energy >= SKILLS.shock.cost) doShock(f); else f.noEnergyT = 0.6;
    }
  }
  if (f.pendingShock) {
    f.pendingShock.t -= dt;
    if (f.pendingShock.t <= 0) { shockHit(f, opp, f.pendingShock); f.pendingShock = null; }
  }

  // 가로 이동 + 밀려남
  f.kb -= f.kb * Math.min(1, (f.onGround ? 7 : 2.5) * dt);
  if (Math.abs(f.kb) < 2) f.kb = 0;
  f.vx = (rolling ? f.rollDir * SKILLS.roll.speed : move * SPEED) + f.kb;

  // 세로 이동
  f.vy += GRAVITY * dt;
  if (f.wall !== 0) f.vy = Math.min(f.vy, 55);   // 벽에 붙으면 천천히 미끄러짐
  const prevY = f.y;
  f.x += f.vx * dt; f.y += f.vy * dt;

  let touch = 0;
  if (f.x < LEFT_WALL + 9) { f.x = LEFT_WALL + 9; touch = -1; if (f.kb < 0) f.kb = 0; }
  if (f.x > RIGHT_WALL - 9) { f.x = RIGHT_WALL - 9; touch = 1; if (f.kb > 0) f.kb = 0; }

  const wasGround = f.onGround;
  f.onGround = false;
  if (f.y >= GROUND) { f.y = GROUND; f.vy = 0; f.onGround = true; }
  else if (f.vy >= 0 && f.dropT <= 0) {
    for (const p of PLATFORMS) {
      if (prevY <= p.y && f.y >= p.y && f.x > p.x - 4 && f.x < p.x + p.w + 4) { f.y = p.y; f.vy = 0; f.onGround = true; break; }
    }
  }
  if (f.onGround) f.jumpsUsed = 0;
  else if (wasGround && f.jumpsUsed === 0) f.jumpsUsed = 1;   // 발판에서 떨어져도 공중 점프 한 번
  f.wall = (!f.onGround && touch !== 0 && move === touch && f.vy > 0) ? touch : 0;

  // 애니메이션 고르기
  let a;
  if (f.stun > 0 || f.hp <= 0) a = 'hit';
  else if (rolling) a = 'double-jump';            // 구르기 그림이 없어서 공중제비 그림을 씀
  else if (f.onGround) a = move !== 0 ? 'run' : 'idle';
  else if (f.wall !== 0) a = 'wall-jump';
  else if (f.jumpsUsed === 2 && f.djT < 0.3) a = 'double-jump';
  else a = f.vy < 0 ? 'jump' : 'fall';
  setAnim(f, a);
}

function pushApart(a, b) {
  const dx = b.x - a.x;
  if (Math.abs(dx) < 16 && Math.abs(a.y - b.y) < 24) {
    const push = (16 - Math.abs(dx)) / 2, s = dx >= 0 ? 1 : -1;
    a.x -= push * s; b.x += push * s;
    for (const f of [a, b]) f.x = Math.max(LEFT_WALL + 9, Math.min(RIGHT_WALL - 9, f.x));
  }
}

// ================= 스킬 =================
function doPunch(f, opp) {
  const s = SKILLS.punch;
  f.cd.punch = s.cd; f.kb += f.facing * 70;
  const reach = { l: f.facing > 0 ? f.x + 4 : f.x - 30, r: f.facing > 0 ? f.x + 30 : f.x - 4, t: f.y - 26, b: f.y };
  if (overlap(reach, boxOf(opp))) hit(opp, f, s.dmg, s.kb, 0, s.stun, 'crack', opp.x, opp.y - 14);
  else spawnFx('crack', f.x + f.facing * 22, f.y - 14, f.facing < 0, 0.5);
}
function doShot(f) {
  f.cd.shot = SKILLS.shot.cd;
  projectiles.push({ owner: f, x: f.x + f.facing * 14, y: f.y - 14, dir: f.facing, t: 0, aiSeen: false });
}
function doShock(f) {
  const s = SKILLS.shock;
  f.cd.shock = s.cd; f.energy -= s.cost; f.castT = 0.3;
  const x = Math.max(LEFT_WALL + 20, Math.min(RIGHT_WALL - 20, f.x + f.facing * 42));
  spawnFx('shock', x, f.y - 87 / 2, f.facing < 0);
  f.pendingShock = { t: s.delay, x, y: f.y };
  shake = Math.max(shake, 2);
}
function shockHit(f, opp, ps) {
  const s = SKILLS.shock;
  const area = { l: ps.x - 28, r: ps.x + 28, t: ps.y - 80, b: ps.y + 2 };
  if (overlap(area, boxOf(opp))) hit(opp, f, s.dmg, s.kb, s.lift, s.stun, 'boom', opp.x, opp.y - 14);
}
function hit(t, a, dmg, kb, lift, stun, fx, fxX, fxY, dir) {
  if (t.invuln > 0 || t.rollT > 0 || state !== 'fight' || t.hp <= 0) return false;
  const d = dir || Math.sign(t.x - a.x) || a.facing;
  t.hp = Math.max(0, t.hp - dmg);
  t.kb = d * kb;
  if (lift) { t.vy = -lift; t.onGround = false; }
  t.stun = stun; t.invuln = 0.12; t.anim = 'hit'; t.animT = 0; t.castT = 0; t.pendingShock = null;
  a.energy = Math.min(100, a.energy + 8); t.energy = Math.min(100, t.energy + 5);
  spawnFx(fx, fxX, fxY, d < 0);
  popups.push({ text: `-${dmg}`, x: t.x, y: t.y - 34, t: 0, color: dmg >= 15 ? '#ffd76a' : '#ffffff' });
  shake = Math.max(shake, dmg >= 15 ? 5 : 2.5);
  hitstop = dmg >= 15 ? 0.12 : 0.05;
  if (t.hp <= 0) { t.stun = 99; endRound(a, 'ko'); }
  return true;
}
function spawnFx(name, x, y, flip, alpha = 1) { effects.push({ def: FX_DEFS[name], x, y, flip, t: 0, alpha }); }

function updateProjectiles(dt) {
  const fighters = [p1, p2];
  for (const p of projectiles) {
    p.t += dt; p.x += p.dir * SKILLS.shot.speed * dt;
    const box = { l: p.x - 10, r: p.x + 10, t: p.y - 3, b: p.y + 3 };
    for (const f of fighters) {
      if (f === p.owner || p.dead || f.rollT > 0) continue;   // 구르는 중이면 총알이 지나감
      if (overlap(box, boxOf(f))) {
        const s = SKILLS.shot;
        hit(f, p.owner, s.dmg, s.kb, 0, s.stun, 'boom', p.x + p.dir * 6, p.y, p.dir);
        p.dead = true;
      }
    }
    if (p.x < -30 || p.x > W + 30) p.dead = true;
  }
  // 총알끼리 부딪치면 둘 다 터짐
  for (let i = 0; i < projectiles.length; i++) for (let j = i + 1; j < projectiles.length; j++) {
    const a = projectiles[i], b = projectiles[j];
    if (!a.dead && !b.dead && a.owner !== b.owner && Math.abs(a.x - b.x) < 14 && Math.abs(a.y - b.y) < 10) {
      a.dead = b.dead = true; spawnFx('boom', (a.x + b.x) / 2, (a.y + b.y) / 2, false);
    }
  }
  projectiles = projectiles.filter(p => !p.dead);
}

// ================= 컴퓨터 상대 =================
const ai = { t: 0, move: 0 };
function cpuInput(f, opp, dt) {
  const inp = { move: 0, jump: false, down: false, s1: false, s2: false, s3: false };
  const dx = opp.x - f.x, adx = Math.abs(dx), dir = Math.sign(dx) || 1, dy = Math.abs(opp.y - f.y);
  ai.t -= dt;
  if (ai.t <= 0 && state === 'fight') {
    ai.t = 0.14 + Math.random() * 0.2;            // 사람처럼 조금 늦게 반응
    if (adx > 120) ai.move = Math.random() < 0.8 ? dir : 0;
    else if (adx < 24) ai.move = Math.random() < 0.35 ? -dir : 0;
    else ai.move = Math.random() < 0.6 ? dir : (Math.random() < 0.5 ? 0 : -dir);
    if (f.energy >= SKILLS.shock.cost && adx > 18 && adx < 70 && dy < 30 && Math.random() < 0.35) { ai.move = 0; inp.s3 = true; }
    else if (adx < 34 && dy < 22 && Math.random() < 0.55) { ai.move = 0; inp.s1 = true; }
    else if (adx >= 60 && dy < 18 && Math.random() < 0.3) { ai.move = 0; inp.s2 = true; }
    if (opp.y < f.y - 40 && Math.random() < 0.45) inp.jump = true;
    else if (Math.random() < 0.05) inp.jump = true;
  }
  for (const p of projectiles) {   // 날아오는 총알 피하기
    if (p.owner !== f && !p.aiSeen && Math.sign(f.x - p.x) === p.dir && Math.abs(f.x - p.x) < 80 && f.onGround) {
      p.aiSeen = true; if (Math.random() < 0.5) inp.jump = true;
    }
  }
  inp.move = ai.move;
  return inp;
}
function inputFor(f, opp, dt) { return f.ctrl === 'cpu' ? cpuInput(f, opp, dt) : humanInput(KEYMAP[f.ctrl]); }

// ================= 한 번 갱신 =================
function update(dt) {
  if (state === 'title') {
    titleT += dt;
    if (pressed.has('Digit1') || pressed.has('Numpad1')) startMatch(1);
    else if (pressed.has('Digit2') || pressed.has('Numpad2')) startMatch(2);
    pressed.clear(); return;
  }
  if (pressed.has('Escape')) { state = 'title'; pressed.clear(); return; }
  if (state === 'over') {
    if (pressed.has('Enter') || pressed.has('NumpadEnter')) startMatch(mode);
    stateT += dt; animateOnly(dt); pressed.clear(); return;
  }
  stateT += dt;
  if (state === 'ready' && stateT > 1.6) state = 'fight';
  if (state === 'ko') {
    dt *= stateT < 0.8 ? 0.35 : 1;                 // KO 순간 느리게
    if (stateT > 2.4) {
      if (wins[0] >= WINS_NEEDED || wins[1] >= WINS_NEEDED) { state = 'over'; stateT = 0; }
      else { round++; startRound(); }
      pressed.clear(); return;
    }
  }
  if (hitstop > 0) { hitstop -= dt; pressed.clear(); return; }
  if (state === 'fight') {
    timer -= dt;
    if (timer <= 0) { timer = 0; endRound(p1.hp > p2.hp ? p1 : p2.hp > p1.hp ? p2 : null, 'time'); }
  }
  const i1 = inputFor(p1, p2, dt), i2 = inputFor(p2, p1, dt);
  updateFighter(p1, p2, i1, dt);
  updateFighter(p2, p1, i2, dt);
  pushApart(p1, p2);
  updateProjectiles(dt);
  animateOnly(dt);
  pressed.clear();
}
function animateOnly(dt) {
  for (const e of effects) e.t += dt;
  effects = effects.filter(e => e.def.loop || e.t * e.def.fps < e.def.frames);
  for (const p of popups) { p.t += dt; p.y -= 18 * dt; }
  popups = popups.filter(p => p.t < 0.8);
  shake = Math.max(0, shake - dt * 20);
  if (state === 'over') for (const f of [p1, p2]) { f.animT += dt; if (f.hp > 0) setAnim(f, 'idle'); }
}

// ================= 그리기 =================
function drawSheet(img, fw, fh, frame, cx, bottom, flip, size = 1) {
  if (!img) return;
  const w = fw * size, h = fh * size;
  const x = Math.round(cx - w / 2), y = Math.round(bottom - h);
  ctx.save();
  if (flip) { ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(img, frame * fw, 0, fw, fh, 0, 0, w, h); }
  else ctx.drawImage(img, frame * fw, 0, fw, fh, x, y, w, h);
  ctx.restore();
}
function charFrame(f) {
  const [n, fps, loop] = CHAR_ANIMS[f.anim];
  const i = Math.floor(f.animT * fps);
  return loop ? i % n : Math.min(i, n - 1);
}
function drawFighter(f) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  const shadowY = f.y >= GROUND - 1 ? GROUND : f.y;
  ctx.beginPath(); ctx.ellipse(Math.round(f.x), shadowY, 9, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  const img = images[`${f.def.file}_${f.anim}.png`];
  if (f.invuln > 0 && Math.floor(f.invuln * 40) % 2 === 0) ctx.globalAlpha = 0.6;
  if (f.rollT > 0) ctx.globalAlpha = 0.5;
  drawSheet(img, f.def.fw, f.def.fh, charFrame(f), f.x, f.y + 1, f.facing < 0);
  ctx.globalAlpha = 1;
  ctx.font = `bold 7px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillStyle = f.def.color; ctx.fillText(f.tag, Math.round(f.x), Math.round(f.y - f.def.fh - 3));
}
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#1b1440'); g.addColorStop(1, '#5a3a7a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(400, 62, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 40; i++) ctx.fillRect((i * 97) % W, (i * 53) % 120 + 4, 1, 1);
  ctx.fillStyle = '#2a1f4a';                                    // 먼 건물
  for (let i = 0; i < 12; i++) { const bw = 30 + (i * 13) % 20, bh = 40 + (i * 37) % 60; ctx.fillRect(i * 42 - 6, GROUND - bh, bw, bh); }
  ctx.fillStyle = '#ffd76a33';
  for (let i = 0; i < 30; i++) ctx.fillRect((i * 71) % W, GROUND - 10 - (i * 29) % 70, 2, 3);
  ctx.fillStyle = '#3d7a3d'; ctx.fillRect(0, GROUND, W, 4);   // 땅
  ctx.fillStyle = '#6b4a2f'; ctx.fillRect(0, GROUND + 4, W, H - GROUND);
  ctx.fillStyle = '#5a3d26';
  for (let x = 0; x < W; x += 16) ctx.fillRect(x + ((x / 16) % 2) * 8, GROUND + 12, 8, 3);
  for (const p of PLATFORMS) {
    ctx.fillStyle = '#8a5f3a'; ctx.fillRect(p.x, p.y, p.w, 6);
    ctx.fillStyle = '#b07d4f'; ctx.fillRect(p.x, p.y, p.w, 2);
    ctx.fillStyle = '#5a3d26'; ctx.fillRect(p.x + 4, p.y + 6, 3, 4); ctx.fillRect(p.x + p.w - 7, p.y + 6, 3, 4);
  }
  ctx.fillStyle = '#2a2244'; ctx.fillRect(0, 0, LEFT_WALL, GROUND); ctx.fillRect(RIGHT_WALL, 0, W - RIGHT_WALL, GROUND);
}
function drawHUD() {
  const barW = 180, y = 10;
  [p1, p2].forEach((f, i) => {
    const x = i === 0 ? 12 : W - 12 - barW;
    ctx.fillStyle = '#1a1430'; ctx.fillRect(x - 1, y - 1, barW + 2, 10);
    const shown = barW * f.hpShown / 100, real = barW * f.hp / 100;
    ctx.fillStyle = '#ff5a5a';
    if (i === 0) ctx.fillRect(x, y, shown, 8); else ctx.fillRect(x + barW - shown, y, shown, 8);
    ctx.fillStyle = f.hp > 30 ? '#ffe05a' : '#ff8a3a';
    if (i === 0) ctx.fillRect(x, y, real, 8); else ctx.fillRect(x + barW - real, y, real, 8);
    // 기력
    const ew = 90, ex = i === 0 ? x : x + barW - ew, ey = y + 12;
    ctx.fillStyle = '#1a1430'; ctx.fillRect(ex - 1, ey - 1, ew + 2, 6);
    const ready = f.energy >= SKILLS.shock.cost;
    ctx.fillStyle = f.noEnergyT > 0 && Math.floor(f.noEnergyT * 10) % 2 ? '#ff5a5a' : ready ? '#6ee8ff' : '#4a7ad8';
    const eFill = ew * f.energy / 100;
    if (i === 0) ctx.fillRect(ex, ey, eFill, 4); else ctx.fillRect(ex + ew - eFill, ey, eFill, 4);
    ctx.fillStyle = '#ffffff88'; ctx.fillRect(ex + ew / 2, ey - 1, 1, 6);   // 50 표시
    // 이름 · 승리 표시
    ctx.font = `bold 8px ${FONT}`; ctx.fillStyle = f.def.color;
    ctx.textAlign = i === 0 ? 'left' : 'right';
    const nx = i === 0 ? x : x + barW;
    ctx.fillText(`${f.tag} ${f.def.name}`, nx, ey + 14);
    for (let w = 0; w < WINS_NEEDED; w++) {
      ctx.fillStyle = w < wins[i] ? '#ffd76a' : '#3a2f5c';
      const dx = i === 0 ? x + barW - 8 - w * 10 : x + 2 + w * 10;
      ctx.beginPath(); ctx.arc(dx + 3, ey + 11, 3, 0, Math.PI * 2); ctx.fill();
    }
    // 스킬 칸 (다시 쓸 수 있을 때까지 어둡게)
    const labels = ['주먹', '총알', '전기', '피하기'];
    const keys = f.ctrl === 'p2' ? [',', '.', '/', '⇧'] : f.ctrl === 'cpu' ? labels : ['F', 'G', 'H', 'E'];
    const names = ['punch', 'shot', 'shock', 'roll'];
    names.forEach((k, j) => {
      const bw = 28, bx = i === 0 ? x + j * (bw + 2) : x + barW - bw - j * (bw + 2), by = ey + 19;
      const rate = f.cd[k] / SKILLS[k].cd;
      const usable = rate <= 0 && (k !== 'shock' || ready);
      ctx.fillStyle = usable ? '#3a2f5c' : '#1a1430'; ctx.fillRect(bx, by, bw, 9);
      if (rate > 0) { ctx.fillStyle = '#ffffff22'; ctx.fillRect(bx, by, bw * (1 - rate), 9); }
      ctx.fillStyle = usable ? '#ffffff' : '#7a7090'; ctx.font = `bold 6px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(f.ctrl === 'cpu' ? keys[j] : `${keys[j]} ${labels[j]}`, bx + bw / 2, by + 6.5);
    });
  });
  ctx.textAlign = 'center'; ctx.font = `bold 16px ${FONT}`;
  ctx.fillStyle = timer <= 10 ? '#ff6a6a' : '#ffffff';
  ctx.fillText(String(Math.ceil(timer)), W / 2, 24);
  ctx.font = `7px ${FONT}`; ctx.fillStyle = '#c8bce8'; ctx.fillText(`라운드 ${round}`, W / 2, 33);
}
function bigText(text, y, size, color) {
  ctx.textAlign = 'center'; ctx.font = `bold ${size}px ${FONT}`;
  ctx.lineWidth = 3; ctx.strokeStyle = '#140f24'; ctx.strokeText(text, W / 2, y);
  ctx.fillStyle = color; ctx.fillText(text, W / 2, y);
}
function drawTitle() {
  drawBackground();
  ctx.fillStyle = 'rgba(10,6,24,0.55)'; ctx.fillRect(0, 0, W, H);
  bigText('스킬 격투', 70, 30, '#ffd76a');
  bigText('닌자 개구리 vs VR 소년', 92, 11, '#e8e4f4');
  const fi = Math.floor(titleT * 20) % 11;
  drawSheet(images['ninja-frog_idle.png'], 32, 32, fi, 150, 190, false, 2);
  drawSheet(images['virtual-guy_idle.png'], 27, 28, fi, 330, 190, true, 2);
  bigText('VS', 172, 18, '#ff6a6a');
  const blink = Math.floor(titleT * 2) % 2 === 0;
  bigText('1  혼자 하기 (컴퓨터와 대결)', 214, 11, blink ? '#ffffff' : '#c8bce8');
  bigText('2  둘이 하기 (한 키보드로)', 232, 11, blink ? '#ffffff' : '#c8bce8');
  bigText('먼저 2라운드를 이기면 승리!', 252, 8, '#9a8cc8');
}
function render() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (missing.length) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff8a8a'; ctx.font = `9px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText('그림 파일을 못 찾았어요 (assets/images 폴더 확인):', 12, 20);
    missing.forEach((m, i) => ctx.fillText('· ' + m, 12, 34 + i * 11));
    return;
  }
  if (state === 'title') { drawTitle(); return; }
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * shake), Math.round((Math.random() - 0.5) * shake));
  drawBackground();
  for (const f of [p1, p2]) drawFighter(f);
  for (const p of projectiles) {
    const d = FX_DEFS.shot;
    drawSheet(images[d.file], d.fw, d.fh, Math.floor(p.t * d.fps) % d.frames, p.x, p.y + 3, p.dir < 0);
  }
  for (const e of effects) {
    const d = e.def, fr = d.loop ? Math.floor(e.t * d.fps) % d.frames : Math.min(d.frames - 1, Math.floor(e.t * d.fps));
    ctx.globalAlpha = e.alpha;
    drawSheet(images[d.file], d.fw, d.fh, fr, e.x, e.y + d.fh / 2, e.flip);
    ctx.globalAlpha = 1;
  }
  for (const p of popups) {
    ctx.globalAlpha = 1 - p.t / 0.8; ctx.font = `bold 9px ${FONT}`; ctx.textAlign = 'center';
    ctx.lineWidth = 2; ctx.strokeStyle = '#140f24'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawHUD();
  if (state === 'ready') {
    if (stateT < 1.0) bigText(`라운드 ${round}`, 120, 24, '#ffffff');
    else bigText('싸워라!', 120, 28, '#ffd76a');
  } else if (state === 'ko') {
    bigText(banner, 112, 30, '#ff6a6a');
    bigText(subBanner, 136, 12, '#ffffff');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(10,6,24,0.5)'; ctx.fillRect(0, 0, W, H);
    const champ = wins[0] >= WINS_NEEDED ? p1 : p2;
    bigText(`${champ.def.name} 최종 승리!`, 110, 22, champ.def.color);
    bigText(`${wins[0]} : ${wins[1]}`, 136, 14, '#ffffff');
    bigText('Enter 다시 하기 · Esc 처음 화면', 162, 9, '#c8bce8');
  }
}

// ================= 시작 =================
const STEP = 1 / 60;
let last = 0, acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000 || 0); last = now;
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
Promise.all(allImageNames().map(loadImage)).then(() => requestAnimationFrame(t => { last = t; frame(t); }));

// 확인용 (자동 검사에서 씀)
window.__game = { get state() { return state; }, get p1() { return p1; }, get p2() { return p2; },
  get wins() { return wins; }, get projectiles() { return projectiles; }, get effects() { return effects; },
  get timer() { return timer; }, update, startMatch, pressed, down, images, missing };
</script>
